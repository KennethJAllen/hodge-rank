[project]
name = "hodge-rank"
version = "0.1.0"
description = "A small Hodge-ranking experiment with Yelp coffee reviews."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["duckdb>=1.1", "numpy>=2.1", "scipy>=1.14"]

[project.scripts]
hodge-rank = "hodge_rank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hodge_rank"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
